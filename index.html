<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0c0e; font-family: 'Rajdhani', sans-serif; min-height: 100vh; overflow: hidden; color: #fff; }

  /* グリッド背景 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,200,50,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,200,50,.04) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── OPENING ── */

    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a0c0e;
    z-index: 100;
    cursor: pointer;
  }
  #opening::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,200,50,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,200,50,.04) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  #opening::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.18) 2px, rgba(0,0,0,.18) 4px);
    pointer-events: none;
  }
  .corner { position: absolute; width: 48px; height: 48px; opacity: .5; }
  .corner-tl { top: 24px; left: 24px; border-top: 2px solid #f5c518; border-left: 2px solid #f5c518; }
  .corner-br { bottom: 24px; right: 24px; border-bottom: 2px solid #f5c518; border-right: 2px solid #f5c518; }
  .op-eyebrow { font-family: 'Oswald', sans-serif; font-size: .65rem; letter-spacing: .35em; text-transform: uppercase; color: #f5c518; margin-bottom: 1.5rem; opacity: 0; animation: fadeIn .6s 1s forwards; position: relative; z-index: 1; }
  .op-title { font-family: 'Oswald', sans-serif; font-size: clamp(3rem, 14vw, 7rem); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #fff; line-height: 1; text-align: center; opacity: 0; animation: glitchIn .8s .4s forwards; position: relative; z-index: 1; }
  .op-title::before, .op-title::after { content: 'sumichannel'; position: absolute; inset: 0; text-align: center; }
  .op-title::before { color: #f5c518; clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%); animation: glitch1 3s 2s infinite; opacity: .7; }
  .op-title::after  { color: #4af;    clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%); animation: glitch2 3s 2.2s infinite; opacity: .5; }
  .op-line { width: 0; height: 1px; background: linear-gradient(90deg, transparent, #f5c518, transparent); margin: 1.8rem auto; animation: expandLine .8s .8s forwards; position: relative; z-index: 1; }
  .op-sub { font-size: .8rem; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.4); margin-top: 1.2rem; opacity: 0; animation: fadeIn .6s 1.4s forwards; position: relative; z-index: 1; }
  .op-prompt { font-size: .7rem; letter-spacing: .28em; text-transform: uppercase; color: #f5c518; opacity: 0; animation: blink 1.2s 2s infinite, fadeIn .5s 2s forwards; position: relative; z-index: 1; margin-top: 2.5rem; }

  /* ── MAIN ── */
  #main {
    display: none;
    min-height: 100vh;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem;
    gap: 1.8rem;
    position: relative;
    z-index: 1;
  }
  .main-corner { position: fixed; width: 40px; height: 40px; opacity: .3; }
  .main-corner.tl { top: 20px; left: 20px; border-top: 1px solid #f5c518; border-left: 1px solid #f5c518; }
  .main-corner.br { bottom: 20px; right: 20px; border-bottom: 1px solid #f5c518; border-right: 1px solid #f5c518; }
  .main-title { font-family: 'Oswald', sans-serif; font-size: clamp(1.8rem, 8vw, 3rem); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #fff; text-align: center; }
  .main-title span { color: #f5c518; }
  .main-sub { font-size: .65rem; letter-spacing: .25em; text-transform: uppercase; color: rgba(255,255,255,.35); }
  .divider { width: 200px; height: 1px; background: linear-gradient(90deg, transparent, #f5c51888, transparent); }

  /* ── ボタンリスト ── */
  .btn-list {
    display: flex;
    flex-direction: column;
    gap: .6rem;
    width: 100%;
    max-width: 440px;
    max-height: 55vh;
    overflow-y: auto;
    padding-right: 4px;
    scrollbar-width: thin;
    scrollbar-color: #f5c51844 transparent;
  }
  .btn-list::-webkit-scrollbar { width: 3px; }
  .btn-list::-webkit-scrollbar-track { background: transparent; }
  .btn-list::-webkit-scrollbar-thumb { background: #f5c51866; border-radius: 2px; }

  .btn {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: .9rem 1.2rem;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.1);
    border-left: 2px solid #f5c518;
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    font-size: .9rem;
    font-weight: 400;
    letter-spacing: .06em;
    text-decoration: none;
    cursor: pointer;
    width: 100%;
    text-align: left;
    transition: background .2s, border-color .2s, padding-left .2s;
    position: relative;
    overflow: hidden;
  }
  .btn::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(245,197,24,.08), transparent); opacity: 0; transition: opacity .2s; }
  .btn:hover { background: rgba(245,197,24,.08); border-color: #f5c518; padding-left: 1.6rem; }
  .btn:hover::before { opacity: 1; }
  .btn-num { font-size: .6rem; color: #f5c518; font-family: 'Oswald', sans-serif; letter-spacing: .1em; width: 20px; flex-shrink: 0; }
  .btn-label { flex: 1; }
  .btn-arrow { font-size: .8rem; color: rgba(255,255,255,.3); transition: color .2s, transform .2s; }
  .btn:hover .btn-arrow { color: #f5c518; transform: translateX(4px); }
  .yt-icon { width: 14px; height: 14px; flex-shrink: 0; opacity: .6; }
  .yt-path { fill: #fff; }
  .footer-txt { font-size: .55rem; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.2); margin-top: .5rem; }

  /* ── モーダル ── */
  #modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.85);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  #modal-bg.open { display: flex; }

  #modal {
    background: #0f1114;
    border: 1px solid rgba(245,197,24,.3);
    border-top: 2px solid #f5c518;
    width: 100%;
    max-width: 420px;
    padding: 1.8rem;
    position: relative;
    animation: fadeUp .3s both;
  }

  .modal-close {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: none;
    border: none;
    color: rgba(255,255,255,.4);
    font-size: 1.2rem;
    cursor: pointer;
    line-height: 1;
    transition: color .2s;
  }
  .modal-close:hover { color: #f5c518; }

  .modal-num { font-size: .6rem; color: #f5c518; font-family: 'Oswald', sans-serif; letter-spacing: .15em; margin-bottom: .5rem; }
  .modal-title { font-family: 'Oswald', sans-serif; font-size: 1.4rem; font-weight: 600; color: #fff; letter-spacing: .05em; margin-bottom: 1rem; line-height: 1.3; }
  .modal-divider { width: 100%; height: 1px; background: rgba(245,197,24,.2); margin-bottom: 1rem; }
  .modal-desc { font-size: .85rem; color: rgba(255,255,255,.6); line-height: 1.9; margin-bottom: 1.5rem; }

  .modal-play {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .8rem;
    width: 100%;
    padding: .9rem;
    background: #f5c518;
    border: none;
    color: #0a0c0e;
    font-family: 'Oswald', sans-serif;
    font-size: .85rem;
    font-weight: 700;
    letter-spacing: .18em;
    text-transform: uppercase;
    cursor: pointer;
    text-decoration: none;
    transition: background .2s;
  }
  .modal-play:hover { background: #ffd940; }

  /* ── ANIMATIONS ── */
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes glitchIn { 0% { opacity:0; transform:skewX(10deg) scaleX(1.1); } 40% { opacity:1; transform:skewX(-3deg) scaleX(1.02); } 60% { transform:skewX(1deg); } 100% { opacity:1; transform:skewX(0) scaleX(1); } }
  @keyframes expandLine { to { width: 240px; } }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }
  @keyframes glitch1 { 0%,95%,100% { transform:none; opacity:0; } 96% { transform:translateX(-4px); opacity:.7; } 97% { transform:translateX(4px); opacity:.7; } 98% { transform:translateX(0); opacity:.7; } 99% { transform:translateX(-2px); opacity:0; } }
  @keyframes glitch2 { 0%,94%,100% { transform:none; opacity:0; } 95% { transform:translateX(5px); opacity:.5; } 96% { transform:translateX(-3px); opacity:.5; } 97% { transform:translateX(2px); opacity:0; } }
  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  .fadein { animation: fadeUp .6s both; }
  .d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}.d4{animation-delay:.4s}.d5{animation-delay:.5s}.d6{animation-delay:.6s}.d7{animation-delay:.7s}
</style>

function openModal(i) {
  playSelectSound();
  var v = videos[i];
  document.getElementById('modal-num').textContent = 'NO. ' + v.num;
  document.getElementById('modal-title').textContent = v.title;
  document.getElementById('modal-desc').textContent = v.desc;
  document.getElementById('modal-play').href = v.url;
  document.getElementById('modal-bg').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modal-bg')) closeModalDirect();
}
function closeModalDirect() {
  playCloseSound();
  document.getElementById('modal-bg').classList.remove('open');
}

// キーボードでも閉じられる
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModalDirect();

// オープニング
var opening = document.getElementById('opening');
var main    = document.getElementById('main');
var bgmStarted = false;

opening.addEventListener('click', function() {
  startBGM();
  opening.style.transition = 'opacity .8s';
  opening.style.opacity = '0';
  setTimeout(function() {
    opening.style.display = 'none';
    main.style.display = 'flex';
  }, 800);
});

// BGM (Web Audio API)
var AudioContext = window.AudioContext || window.webkitAudioContext;
var actx = null;

function startBGM() {
  if (bgmStarted) return;
  bgmStarted = true;
  actx = new AudioContext();
  var master = actx.createGain();
  master.gain.value = 0.18;
  master.connect(actx.destination);
  var convolver = actx.createConvolver();
  var revLen = actx.sampleRate * 2.5;
  var revBuf = actx.createBuffer(2, revLen, actx.sampleRate);
  for (var ch = 0; ch < 2; ch++) {
    var d = revBuf.getChannelData(ch);
    for (var i = 0; i < revLen; i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/revLen,2.5);
  }
  convolver.buffer = revBuf;
  var revGain = actx.createGain();
  revGain.gain.value = 0.3;
  convolver.connect(revGain); revGain.connect(master);
  var lpf = actx.createBiquadFilter();
  lpf.type = 'lowpass'; lpf.frequency.value = 1800;
  lpf.connect(master); lpf.connect(convolver);

  // マスターゲインを10秒後からじわーっと4秒かけてフェードアウト
  var fadeStart = actx.currentTime + 9.0;
  master.gain.setValueAtTime(0.18, fadeStart);
  master.gain.linearRampToValueAtTime(0.0, fadeStart + 4.0);

  function makeDrone(freq, vol) {
    var osc = actx.createOscillator();
    var g = actx.createGain();
    osc.type = 'sawtooth'; osc.frequency.value = freq;
    var lfo = actx.createOscillator();
    var lfoG = actx.createGain();
    lfo.frequency.value = 0.3; lfoG.gain.value = freq * 0.003;
    lfo.connect(lfoG); lfoG.connect(osc.frequency); lfo.start();
    g.gain.value = vol; osc.connect(g); g.connect(lpf); osc.start();
  }
  makeDrone(55, 0.18); makeDrone(110, 0.10); makeDrone(82.4, 0.08);
  var bpm = 72, step = 60/bpm, t = actx.currentTime + 0.1;
  function kick(when) {
    var osc = actx.createOscillator(), g = actx.createGain();
    osc.frequency.setValueAtTime(150,when); osc.frequency.exponentialRampToValueAtTime(40,when+0.12);
    g.gain.setValueAtTime(0.9,when); g.gain.exponentialRampToValueAtTime(0.001,when+0.25);
    osc.connect(g); g.connect(master); osc.start(when); osc.stop(when+0.3);
  }
  function snare(when) {
    var buf = actx.createBuffer(1,actx.sampleRate*0.15,actx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    var src=actx.createBufferSource(); src.buffer=buf;
    var g=actx.createGain(); g.gain.setValueAtTime(0.22,when); g.gain.exponentialRampToValueAtTime(0.001,when+0.15);
    var hpf=actx.createBiquadFilter(); hpf.type='highpass'; hpf.frequency.value=2000;
    src.connect(hpf); hpf.connect(g); g.connect(master); src.start(when);
  }
  function hihat(when,vol) {
    var buf=actx.createBuffer(1,actx.sampleRate*0.05,actx.sampleRate);
    var d=buf.getChannelData(0);
    for (var i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    var src=actx.createBufferSource(); src.buffer=buf;
    var g=actx.createGain(); g.gain.setValueAtTime(vol,when); g.gain.exponentialRampToValueAtTime(0.001,when+0.05);
    var hpf=actx.createBiquadFilter(); hpf.type='highpass'; hpf.frequency.value=8000;
    src.connect(hpf); hpf.connect(g); g.connect(master); src.start(when);
  }
  var melody=[220,220,247,220,196,165,196,220], mi=0;
  function playMelody(when) {
    var osc=actx.createOscillator(), g=actx.createGain();
    osc.type='triangle'; osc.frequency.value=melody[mi%melody.length]; mi++;
    g.gain.setValueAtTime(0,when); g.gain.linearRampToValueAtTime(0.12,when+0.05); g.gain.exponentialRampToValueAtTime(0.001,when+0.8);
    osc.connect(g); g.connect(lpf); osc.start(when); osc.stop(when+1);
  }
  // 10秒+フェード分をカバー（4小節分）
  var bars=4;
  for (var b=0;b<bars;b++) {
    var bt=t+b*step*4;
    kick(bt); kick(bt+step*2); snare(bt+step); snare(bt+step*3);
    for (var h=0;h<8;h++) hihat(bt+h*step*0.5, h%2===0?0.12:0.07);
    if (b%2===0) playMelody(bt+step*0.5);
  }
}

// 操作音：ボタン選択時のクリック音
function playSelectSound() {
  if (!actx) {
    actx = new AudioContext();
  }
  // 短いビープ2音（ピポ）
  var t = actx.currentTime;
  [440, 660].forEach(function(freq, i) {
    var osc = actx.createOscillator();
    var g = actx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0, t + i*0.07);
    g.gain.linearRampToValueAtTime(0.15, t + i*0.07 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + i*0.07 + 0.08);
    osc.connect(g); g.connect(actx.destination);
    osc.start(t + i*0.07); osc.stop(t + i*0.07 + 0.1);
  });
}

// モーダルを閉じる時の音
function playCloseSound() {
  if (!actx) return;
  var t = actx.currentTime;
  var osc = actx.createOscillator();
  var g = actx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(440, t);
  osc.frequency.exponentialRampToValueAtTime(220, t + 0.1);
  g.gain.setValueAtTime(0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  osc.connect(g); g.connect(actx.destination);
  osc.start(t); osc.stop(t + 0.15);
}
